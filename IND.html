<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match Info</title>
<style>
  body {
    font-family: 'Open Sans', Helvetica, Arial, sans-serif;
    background: #f9f9f9;
    margin: 0;
    padding: 10px;
  }

  #match-container {
    max-width: 600px;
    margin: auto;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    overflow: hidden;
  }

  /* Banner */
  #banner-container img {
    width: 100%;
    height: auto;
    border-bottom: 3px solid #0a0647;
    display: none;
  }

  /* Match Header */
  #match-title {
    display: block;
    background: #0a0647;
    color: white;
    padding: 15px;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
  }

  /* Info Table */
  .match-info {
    width: 100%;
    border-collapse: collapse;
  }

  .match-info th,
  .match-info td {
    border: 1px solid #ccc;
    padding: 10px;
    font-size: 14px;
    text-align: center;
  }

  .match-info th {
    background: #000;
    color: white;
  }

  /* Section Titles */
  .section-title {
    background: #020852;
    color: white;
    text-align: center;
    padding: 10px;
    font-weight: bold;
    font-size: 16px;
  }

  /* Lineup */
  #lineup-content {
    text-align: center;
    padding: 10px;
  }

  /* Telecast Links */
  #telecast-links a {
    background: #ff0000;
    color: white;
    text-decoration: none;
    padding: 8px;
    border-radius: 3px;
    display: block;
    width: 90%;
    margin: 5px auto;
    transition: all 0.3s ease;
    font-weight: bold;
  }

  #telecast-links a:hover {
    background: #cc0000;
    transform: scale(1.03);
  }

  /* Ad Section */
  .ad-section {
    text-align: center;
    margin: 15px 0;
  }
</style>

</head>
<body>

<div id="match-container">

  <!-- Banner -->
  <div id="banner-container">
    <img id="banner-image" src="" alt="Match Banner">
  </div>

  <!-- Match Title -->
  <div id="match-title">Not Available</div>

  <!-- Match Info -->
  <table class="match-info">
    <tr><th colspan="2">Match Info</th></tr>
    <tr><td><b>Date</b></td><td id="match-date">Not Available</td></tr>
    <tr><td><b>Time</b></td><td id="match-time">Not Available</td></tr>
    <tr><td><b>Stadium</b></td><td id="match-stadium">Not Available</td></tr>
    <tr><td><b>League</b></td><td id="match-league">Not Available</td></tr>
    <tr><td><b>Round</b></td><td id="match-round">Not Available</td></tr>
    <tr><td><b>Broadcaster</b></td><td id="match-broadcaster">Not Available</td></tr>
  </table>

  <!-- Ad Section -->
  <div class="ad-section">
  
  </div>

  <!-- Lineup -->
  <div class="section-title">Match Lineup</div>
  <div id="lineup-content">&#11093; Not Available</div>

  <!-- Telecast Links -->
  <div class="section-title">Match Live Telecast Info</div>
  <div id="telecast-links">
    <div style="color:#666; padding:10px;">Live stream links not available</div>
  </div>
</div>

<script>
// Configuration
const JSON_URL = 'https://yonotv.pages.dev/wwc.json';

// Function to update page with JSON data
function updateMatchData(data) {
  const match = data.match || {};
  const telecastLinks = data.telecast_links || [];
  const team1 = data.team1 || {};
  const team2 = data.team2 || {};

  document.getElementById('match-title').textContent = match.title || 'Not Available';
  document.getElementById('match-date').textContent = match.date || 'Not Available';
  document.getElementById('match-time').textContent = match.time || 'Not Available';
  document.getElementById('match-stadium').textContent = match.stadium || 'Not Available';
  document.getElementById('match-league').textContent = match.league || 'Not Available';
  document.getElementById('match-round').textContent = match.round || 'Not Available';
  document.getElementById('match-broadcaster').textContent = match.broadcaster || 'Not Available';

  const bannerImg = document.getElementById('banner-image');
  if (match.banner_image) {
    bannerImg.src = match.banner_image;
    bannerImg.style.display = 'block';
  }

  const lineupContent = document.getElementById('lineup-content');
  if (match.lineup_published && team1.name && team2.name) {
    lineupContent.innerHTML = `
      <div style="display:flex;justify-content:space-around;flex-wrap:wrap;gap:5px;">
        <div style="text-align:center;min-width:45%;">
          <div><strong style="color:#020852;">${team1.name}</strong></div>
          <div style="font-size:13px;">${team1.lineup || 'Not Available'}</div>
        </div>
        <div style="text-align:center;min-width:45%;">
          <div><strong style="color:#020852;">${team2.name}</strong></div>
          <div style="font-size:13px;">${team2.lineup || 'Not Available'}</div>
        </div>
      </div>`;
  } else {
    lineupContent.innerHTML = `<span style="font-size:medium;">&#11093; Not Available</span>`;
  }

  const telecastContainer = document.getElementById('telecast-links');
  if (telecastLinks.length > 0) {
    telecastContainer.innerHTML = telecastLinks.map(link => `
      <a href="${link.url}" target="_blank">${link.name}</a>
    `).join('');
  }
}

// Load JSON
async function loadMatchData() {
  try {
    const response = await fetch(JSON_URL);
    if (!response.ok) throw new Error('Network error');
    const data = await response.json();
    updateMatchData(data);
  } catch (e) {
    console.log('JSON not connected or error loading data.');
  }
}

document.addEventListener('DOMContentLoaded', loadMatchData);
</script>

</html>
