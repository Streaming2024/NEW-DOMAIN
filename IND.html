<script>
// Configuration - UPDATE THIS URL WITH YOUR JSON FILE URL
const JSON_URL = 'https://yonotv.pages.dev/wwc.json';

// Function to update page with JSON data
function updateMatchData(data) {
  const match = data.match || {};
  const telecastLinks = data.telecast_links || [];
  const team1 = data.team1 || {};
  const team2 = data.team2 || {};

  // Update match info - ALL fields including title
  document.getElementById('match-title').textContent = match.title || 'Not Available';
  document.getElementById('match-date').textContent = match.date || 'Not Available';
  document.getElementById('match-time').textContent = match.time || 'Not Available';
  document.getElementById('match-stadium').textContent = match.stadium || 'Not Available';
  document.getElementById('match-league').textContent = match.league || 'Not Available';
  document.getElementById('match-round').textContent = match.round || 'Not Available';
  document.getElementById('match-broadcaster').textContent = match.broadcaster || 'Not Available';

  // Update banner - No link, just image
  const bannerImg = document.getElementById('banner-image');
  if (match.banner_image) {
    bannerImg.src = match.banner_image;
    bannerImg.style.display = 'block';
  }

  // Update lineup - COMPACT layout with minimal space
  const lineupContent = document.getElementById('lineup-content');
  if (match.lineup_published && team1.name && team2.name) {
    lineupContent.innerHTML = `
      <div style="display: flex; justify-content: space-around; flex-wrap: wrap; gap: 5px; padding: 5px;">
        <!-- Team 1 -->
        <div style="text-align: center; min-width: 45%;">
          <div style="background: #f5f5f5; padding: 5px; border-radius: 3px; text-align: center; margin-bottom: 5px;">
            <strong style="color: #020852; font-size: 14px;">${team1.name}:</strong>
          </div>
          <div style="background: #f5f5f5; padding: 5px; border-radius: 3px; text-align: center;">
            <span style="font-size: 12px; line-height: 1.3;">${team1.lineup || 'Not Available'}</span>
          </div>
        </div>
        
        <!-- Team 2 -->
        <div style="text-align: center; min-width: 45%;">
          <div style="background: #f5f5f5; padding: 5px; border-radius: 3px; text-align: center; margin-bottom: 5px;">
            <strong style="color: #020852; font-size: 14px;">${team2.name}:</strong>
          </div>
          <div style="background: #f5f5f5; padding: 5px; border-radius: 3px; text-align: center;">
            <span style="font-size: 12px; line-height: 1.3;">${team2.lineup || 'Not Available'}</span>
          </div>
        </div>
      </div>
    `;
  } else {
    lineupContent.innerHTML = `
      <div style="text-align: center;">
        <span style="font-size: medium;">&#11093; Not Available</span>
      </div>
    `;
  }

  // Update telecast links - 90% width, center aligned, one below another
  const telecastContainer = document.getElementById('telecast-links');
  if (telecastLinks.length > 0) {
    telecastContainer.innerHTML = telecastLinks.map(link => `
      <div style="margin-bottom: 5px; display: flex; justify-content: center;">
        <a href="${link.url}" target="_blank" 
           style="background: #ff0000; color: white; padding: 8px; text-decoration: none; 
                  border: 2px solid #cc0000; border-radius: 3px; 
                  transition: all 0.3s ease; font-weight: bold; text-align: center;
                  width: 90%; display: block; font-size: 14px;"
           onmouseover="this.style.background='#cc0000'; this.style.transform='scale(1.02)';"
           onmouseout="this.style.background='#ff0000'; this.style.transform='scale(1)';">
          ${link.name}
        </a>
      </div>
    `).join('');
  }
}

// Function to load JSON data
async function loadMatchData() {
  try {
    const response = await fetch(JSON_URL);
    
    if (!response.ok) {
      throw new Error('Network response was not ok');
    }
    
    const data = await response.json();
    updateMatchData(data);
    
  } catch (error) {
    console.log('JSON not connected or error loading data. Showing default "Not Available" messages.');
  }
}

// Load data when page is ready
document.addEventListener('DOMContentLoaded', function() {
  loadMatchData();
});
</script>
